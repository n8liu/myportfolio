<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan Liu - Social</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            --d: 2px;
            background: radial-gradient(
                circle at 
                var(--d) 
                var(--d), 
                #513989 calc(var(--d) - 2px), 
                #121212 var(--d)
            ) 
            15px 15px / 50px 50px fixed;
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .profile {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .profile img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 2px solid #513989;
        }

        .profile h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .profile p {
            color: #cccccc;
            font-size: 0.9rem;
        }

        .links {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin: 0 auto;
        }

        .link-box {
            background: transparent;
            border: 1.5px solid #444;
            border-radius: 14px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
            box-shadow: none;
            position: relative;
        }

        .link-box i {
            font-size: 1.5rem;
            margin-right: 0;
            width: 36px;
            min-width: 36px;
            text-align: center;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-box span {
            flex: 1;
            text-align: center;
            display: block;
            margin-right: 35px;
        }

        .link-box:hover {
            background: rgba(255,255,255,0.03);
            border-color: #513989;
            color: #ffe7a0;
        }

        .link-box.linkedin i { color: #0077b5; }
        .link-box.instagram i { color: #e4405f; }
        .link-box.email i { color: #ea4335; }
        .link-box.github i { color: #7c3aed; }
        .link-box.website i { color: #513989; }
        .link-box.photo i { color: #ffe7a0; }

        @media (max-width: 480px) {
            .links {
                padding: 0 5px;
                gap: 13px;
            }
            .link-box {
                padding: 14px 10px;
                font-size: 1rem;
            }
            .link-box i {
                margin-right: 12px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="profile">
        <img src="assets/profile.jpeg" alt="Nathan Liu">
        <h1>Nathan Liu</h1>
        <p>Data Science Student @ UC Berkeley</p>
    </div>

    <div class="links">
        <a href="https://github.com/n8liu" class="link-box social-link github" target="_blank">
            <i class="fab fa-github"></i>
            <span>GitHub</span>
        </a>
        <a href="https://www.linkedin.com/in/n8liu/" class="link-box social-link linkedin" target="_blank">
            <i class="fab fa-linkedin"></i>
            <span>LinkedIn</span>
        </a>
        <a href="https://www.instagram.com/n8.liu/" class="link-box social-link instagram" target="_blank">
            <i class="fab fa-instagram"></i>
            <span>Instagram</span>
        </a>
        <a href="mailto:nathan.dtliu@gmail.com" class="link-box social-link email">
            <i class="fas fa-envelope"></i>
            <span>Email</span>
        </a>
        <a href="/index.html" class="link-box website">
            <i class="fas fa-globe"></i>
            <span>Portfolio Website</span>
        </a>
        <a href="photos.html" class="link-box photo">
            <i class="fas fa-camera"></i>
            <span>Photography</span>
        </a>
    </div>
</body>
</html>
