<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan Liu - Statistics</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/styles.css">
    <style>
      body {
        min-height: 100vh;
      }
      .stats-container {
        margin: 4rem auto;
        min-width: 900px;
        background: #232323;
        border-radius: 16px;
        padding: 2rem 2.5rem;
        box-shadow: 0 2px 24px #0005;
        color: #fff;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .stats-title {
        text-align: center;
        margin-top: 8rem;
        margin-bottom: 0rem;
        font-size: 2rem;
        font-weight: 600;
        color: #ffffff;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        font-size: 1.2rem;
      }
      .stat-label {
        color: #bbb;
      }
      .stat-value {
        font-weight: bold;
        color: #fff;
      }
      .stats-title a:hover {
        opacity: 0.8;
        transition: opacity 0.3s ease;
      }
    </style>
</head>
<body>
  <div class="stats-title"><a href="/index.html" style="color:white;text-decoration:none;">Website Statistics</a></div>
  <div class="stats-container">
    <div class="stat-row">
      <span class="stat-label">Total Page Viewers:</span>
      <span class="stat-value" id="cf-total-views">Loading...</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Unique Viewers:</span>
      <span class="stat-value" id="unique-visitors">Loading...</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Views in Last 24h:</span>
      <span class="stat-value" id="requests-24h">Loading...</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Unique Viewers in Last 24h:</span>
      <span class="stat-value" id="viewers-24h">Loading...</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Resume Button Clicks:</span>
      <span class="stat-value" id="resume-clicks">Loading...</span>
    </div>
  </div>
  <div style="max-width:1400px;min-width:700px;margin:2rem auto 0 auto;">
    <canvas id="statsChart" width="1200" height="400"></canvas>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      // Fetch total views from your Durable Object
      fetch('https://myportfolio.nathanliu528.workers.dev/api/total')
        .then(res => res.json())
        .then(data => {
          document.getElementById('cf-total-views').textContent = data.total ?? '0';
        })
        .catch(() => {
          document.getElementById('cf-total-views').textContent = '?';
        });
      // Fetch unique visitors from Durable Object
      fetch('https://myportfolio.nathanliu528.workers.dev/api/unique/count')
        .then(res => res.json())
        .then(data => {
          document.getElementById('unique-visitors').textContent = data.count ?? '0';
        })
        .catch(() => {
          document.getElementById('unique-visitors').textContent = '?';
        });
      // Fetch resume clicks from Durable Object
      fetch('https://myportfolio.nathanliu528.workers.dev/api/resume/count')
        .then(res => res.json())
        .then(data => {
          document.getElementById('resume-clicks').textContent = data.clicks ?? '0';
        })
        .catch(() => {
          document.getElementById('resume-clicks').textContent = '?';
        });
      // Fetch requests in last 24h
      fetch('https://myportfolio.nathanliu528.workers.dev/api/total/requests24h')
        .then(res => res.json())
        .then(data => {
          document.getElementById('requests-24h').textContent = data.requests24h ?? '0';
        })
        .catch(() => {
          document.getElementById('requests-24h').textContent = '?';
        });
      // Fetch viewers in last 24h
      fetch('https://myportfolio.nathanliu528.workers.dev/api/unique/visitors24h')
        .then(res => res.json())
        .then(data => {
          document.getElementById('viewers-24h').textContent = data.visitors24h ?? '0';
        })
        .catch(() => {
          document.getElementById('viewers-24h').textContent = '?';
        });
      // Fetch 7-day history for chart
      Promise.all([
        fetch('https://myportfolio.nathanliu528.workers.dev/api/total/history7d').then(r=>r.json()),
        fetch('https://myportfolio.nathanliu528.workers.dev/api/unique/history7d').then(r=>r.json())
      ]).then(([total, unique]) => {
        const labels = total.days.map(ts => {
          const d = new Date(ts);
          return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
        });
        const ctx = document.getElementById('statsChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Views',
                data: total.counts,
                borderColor: '#4f8cff',
                backgroundColor: 'rgba(79,140,255,0.1)',
                fill: true,
                tension: 0.3
              },
              {
                label: 'Unique Viewers',
                data: unique.counts,
                borderColor: '#ffb14f',
                backgroundColor: 'rgba(255,177,79,0.1)',
                fill: true,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'top' },
              title: { display: true, text: '7-Day Viewer Trends' }
            },
            scales: {
              y: { beginAtZero: true, ticks: { precision:0 } }
            }
          }
        });
      });
    });
  </script>
</body>
</html>
