<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Explore Nathan Liu's photography portfolio featuring urban landscapes, travel photography from California, Japan, Hawaii, and South Korea. View settings and detailed camera info.">
    <meta name="keywords" content="Nathan Liu Photography, Travel Photography, Urban Photography, California, Japan, Hawaii, South Korea, Landscape Photography">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Nathan Liu - Photography Portfolio">
    <meta property="og:description" content="Travel and urban photography from California, Japan, Hawaii, and South Korea">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nathanliu.dev/pages/photos.html">
    
    <title>Nathan Liu - Photography Portfolio</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Specific layout overrides for standalone photo window */
        .header-nav .nav-tab {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Top Navigation Tabs (Carolyn Wang Style, links redirect to home) -->
    <nav class="header-nav" aria-label="Primary Navigation">
        <a href="/#home" class="nav-tab">home</a>
        <a href="/#experience" class="nav-tab">experience</a>
        <a href="/#projects" class="nav-tab">projects</a>
        <a href="/#education" class="nav-tab">education</a>
        <a href="#" class="nav-tab active">photography</a>
        <a href="/#blog" class="nav-tab">blog</a>
        <a href="/#stats" class="nav-tab">stats</a>
        <button id="theme-toggle" class="nav-tab theme-toggle" aria-label="Toggle dark mode">dark mode</button>
    </nav>

    <!-- OS Desktop Window (PostHog Theme) -->
    <main class="os-window">
        <!-- Titlebar -->
        <div class="window-titlebar">
            <div class="window-title">
                <i class="fas fa-images"></i> <span id="window-path-text">C:\nathan\portfolio\gallery.exe</span>
            </div>
            <div class="window-controls">
                <button class="win-btn" onclick="window.location.href='/'">_</button>
                <button class="win-btn" onclick="window.location.href='/'">口</button>
                <button class="win-btn close" onclick="window.location.href='/'">X</button>
            </div>
        </div>

        <!-- Menu Bar -->
        <div class="window-menubar">
            <div class="menu-item" onclick="window.location.href='/'">File</div>
            <div class="menu-item" onclick="alert('This document is read-only.')">Edit</div>
            <div class="menu-item" onclick="alert('View settings: Retro OS Theme active.')">View</div>
            <div class="menu-item" onclick="window.location.href='/#stats'">Tools</div>
            <div class="menu-item" onclick="alert('Email nathan.dtliu@gmail.com for help.')">Help</div>
        </div>

        <!-- Body Content -->
        <div class="window-body">
            <section class="panel active" style="display: block;">
                <div class="photo-panel-layout">
                    <div class="photo-cats" id="photo-category-filters">
                        <button class="photo-cat active" data-category="all">all</button>
                        <button class="photo-cat" data-category="california">california</button>
                        <button class="photo-cat" data-category="japan">japan</button>
                        <button class="photo-cat" data-category="hawaii">hawaii</button>
                        <button class="photo-cat" data-category="south_korea">south korea</button>
                    </div>

                    <div id="loading" style="font-family: var(--font-mono); padding: 2rem; text-align: center;">
                        loading photo gallery...
                    </div>

                    <div class="photo-grid-layout" id="portfolio-photo-grid" style="display: none;">
                        <!-- Images will be loaded dynamically -->
                    </div>
                </div>
            </section>
        </div>

        <!-- Taskbar / Status bar -->
        <div class="window-taskbar">
            <div class="taskbar-left">
                <button class="start-btn" onclick="window.location.href='/'">
                    <i class="fas fa-desktop"></i> nathan.exe
                </button>
                <span>System Status: Online</span>
            </div>
            <div class="taskbar-right">
                <div class="taskbar-stat">
                    <i class="fas fa-eye"></i> active: <strong class="viewer-count">0</strong>
                </div>
                <div class="taskbar-stat">
                    <i class="fas fa-clock"></i> <span id="taskbar-time">00:00 AM</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Photo Modal Dialog (Retro OS alert style) -->
    <div class="modal-overlay" id="photo-modal">
        <div class="modal-dialog">
            <div class="modal-titlebar">
                <div class="window-title">
                    <i class="fas fa-image"></i> image_viewer.exe
                </div>
                <div class="window-controls">
                    <button class="win-btn close" id="modal-close-btn">X</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-img-container">
                    <img id="modal-image" src="" alt="Photo Details">
                </div>
                <div class="modal-details">
                    <h4 id="modal-photo-name">Photo Title</h4>
                    <div style="margin-top: 1rem; display: flex; flex-direction: column; gap: 0.4rem;">
                        <div class="exif-row">
                            <span class="exif-label">camera</span>
                            <span class="exif-val" id="exif-camera">-</span>
                        </div>
                        <div class="exif-row">
                            <span class="exif-label">lens</span>
                            <span class="exif-val" id="exif-lens">-</span>
                        </div>
                        <div class="exif-row">
                            <span class="exif-label">exposure</span>
                            <span class="exif-val" id="exif-exposure">-</span>
                        </div>
                        <div class="exif-row">
                            <span class="exif-label">aperture</span>
                            <span class="exif-val" id="exif-aperture">-</span>
                        </div>
                        <div class="exif-row">
                            <span class="exif-label">iso</span>
                            <span class="exif-val" id="exif-iso">-</span>
                        </div>
                        <div class="exif-row">
                            <span class="exif-label">location</span>
                            <span class="exif-val" id="exif-location">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Clock status updates
            const clockElement = document.getElementById('taskbar-time');
            function updateClock() {
                if (!clockElement) return;
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const hoursStr = String(hours).padStart(2, '0');
                clockElement.textContent = `${hoursStr}:${minutes} ${ampm}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // Dark Mode toggling
            const themeToggleBtn = document.getElementById('theme-toggle');
            function applyTheme(theme) {
                if (theme === 'dark') {
                    document.body.classList.add('dark');
                    if (themeToggleBtn) themeToggleBtn.textContent = 'light mode';
                } else {
                    document.body.classList.remove('dark');
                    if (themeToggleBtn) themeToggleBtn.textContent = 'dark mode';
                }
            }
            const savedTheme = localStorage.getItem('portfolio-theme') || 
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(savedTheme);

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const currentTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
                    localStorage.setItem('portfolio-theme', currentTheme);
                    applyTheme(currentTheme);
                });
            }

            // Image Gallery Management
            const photoGrid = document.getElementById('portfolio-photo-grid');
            const loadingElement = document.getElementById('loading');
            const photoCategoryFilters = document.getElementById('photo-category-filters');
            const photoModal = document.getElementById('photo-modal');
            const modalImage = document.getElementById('modal-image');
            const modalPhotoName = document.getElementById('modal-photo-name');
            const modalCloseBtn = document.getElementById('modal-close-btn');

            // EXIF DOM elements
            const exifCamera = document.getElementById('exif-camera');
            const exifLens = document.getElementById('exif-lens');
            const exifExposure = document.getElementById('exif-exposure');
            const exifAperture = document.getElementById('exif-aperture');
            const exifIso = document.getElementById('exif-iso');
            const exifLocation = document.getElementById('exif-location');

            async function loadCategories() {
                try {
                    const response = await fetch(window.location.origin + '/api/categories');
                    if (response.ok) {
                        const categories = await response.json();
                        if (categories && categories.length > 0) {
                            photoCategoryFilters.innerHTML = '<button class="photo-cat active" data-category="all">all</button>';
                            categories.forEach(cat => {
                                const btn = document.createElement('button');
                                btn.className = 'photo-cat';
                                btn.setAttribute('data-category', cat.name);
                                btn.textContent = cat.displayName || cat.name.toLowerCase();
                                photoCategoryFilters.appendChild(btn);
                            });
                        }
                    }
                } catch (e) {
                    console.warn('Fallback category setup.');
                }
            }

            async function loadPhotos(category) {
                loadingElement.style.display = 'block';
                photoGrid.style.display = 'none';

                try {
                    const response = await fetch(window.location.origin + `/api/images/${category}`);
                    if (!response.ok) throw new Error('API error');
                    const images = await response.json();
                    
                    if (images.length === 0) {
                        loadingElement.textContent = 'No photos found in this category.';
                        return;
                    }
                    renderPhotos(images);
                } catch (e) {
                    console.warn('Fallback static images.');
                    loadFallbackPhotos(category);
                }
            }

            function loadFallbackPhotos(category) {
                const fallbacks = [
                    { url: '/assets/featured-photo.png', name: 'Berkeley Sunset', camera: 'Fujifilm X-T5', lens: 'XF 35mm F1.4 R', exposure: '1/250s', aperture: 'f/4.0', iso: '400', location: 'California' },
                    { url: '/assets/landscape-photo.png', name: 'Pacific Coast Highway', camera: 'Fujifilm X-T5', lens: 'XF 18-55mm F2.8-4 R LM OIS', exposure: '1/500s', aperture: 'f/8.0', iso: '125', location: 'California' },
                    { url: '/assets/urban-photo.png', name: 'Shibuya Streets', camera: 'Fujifilm X-T5', lens: 'XF 35mm F1.4 R', exposure: '1/125s', aperture: 'f/2.0', iso: '800', location: 'Japan' }
                ];

                const filtered = category === 'all' 
                    ? fallbacks 
                    : fallbacks.filter(f => f.location.toLowerCase().includes(category) || (category === 'california' && f.location === 'California'));

                if (filtered.length === 0) {
                    loadingElement.textContent = 'No fallback images in this category.';
                    return;
                }
                renderPhotos(filtered);
            }

            function renderPhotos(images) {
                loadingElement.style.display = 'none';
                photoGrid.style.display = 'grid';
                photoGrid.innerHTML = '';

                images.forEach(image => {
                    const card = document.createElement('div');
                    card.className = 'photo-card';

                    const img = document.createElement('img');
                    let imgUrl = image.url;
                    if (!imgUrl.startsWith('http') && !imgUrl.startsWith('/')) {
                        imgUrl = '/' + imgUrl;
                    }
                    img.src = imgUrl;
                    img.alt = image.name || 'Portfolio photo';
                    img.loading = 'lazy';

                    card.appendChild(img);
                    card.addEventListener('click', () => openPhotoModal(image));
                    photoGrid.appendChild(card);
                });
            }

            function openPhotoModal(photo) {
                let imgUrl = photo.url;
                if (!imgUrl.startsWith('http') && !imgUrl.startsWith('/')) {
                    imgUrl = '/' + imgUrl;
                }

                modalImage.src = imgUrl;
                modalPhotoName.textContent = photo.name || 'Untitled Image';

                exifCamera.textContent = photo.camera || photo.exif?.camera || 'Fujifilm X-T5';
                exifLens.textContent = photo.lens || photo.exif?.lens || 'XF 35mm F1.4 R';
                exifExposure.textContent = photo.exposure || photo.exif?.exposure || '1/250s';
                exifAperture.textContent = photo.aperture || photo.exif?.aperture || 'f/5.6';
                exifIso.textContent = photo.iso || photo.exif?.iso || '200';
                exifLocation.textContent = photo.location || photo.exif?.location || 'California';

                photoModal.classList.add('active');
            }

            function closePhotoModal() {
                photoModal.classList.remove('active');
            }

            if (modalCloseBtn) modalCloseBtn.addEventListener('click', closePhotoModal);
            if (photoModal) {
                photoModal.addEventListener('click', function(e) {
                    if (e.target === photoModal) closePhotoModal();
                });
            }

            // Category filter click events
            if (photoCategoryFilters) {
                photoCategoryFilters.addEventListener('click', function(e) {
                    const target = e.target;
                    if (target.classList.contains('photo-cat')) {
                        document.querySelectorAll('.photo-cat').forEach(b => b.classList.remove('active'));
                        target.classList.add('active');
                        const category = target.getAttribute('data-category');
                        loadPhotos(category);
                    }
                });
            }

            // Start up
            await loadCategories();
            await loadPhotos('all');
            
            // Fade in body
            document.body.classList.add('loaded');
        });
    </script>
    <script src="/viewers.js"></script>
</body>
</html>
