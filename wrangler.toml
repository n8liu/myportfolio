# Cloudflare Workers configuration
name = "myportfolio"
compatibility_date = "2023-12-01"
main = "functions/_worker.js"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "myportfolio"
preview_bucket_name = "myportfolio"

[durable_objects]
bindings = [
  { name = "VIEWER_COUNTER", class_name = "ViewerCounter" },
  { name = "SESSION_TRACKER", class_name = "SessionTracker" },
  { name = "TOTAL_COUNTER", class_name = "TotalCounter" },
  { name = "RESUME_COUNTER", class_name = "ResumeCounter" },
  { name = "UNIQUE_VISITORS", class_name = "UniqueVisitors" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "ViewerCounter" ]

[[migrations]]
tag = "v2"
new_sqlite_classes = [ "SessionTracker" ]

[[migrations]]
tag = "v3"
new_sqlite_classes = [ "TotalCounter" ]

[[migrations]]
tag = "v4"
new_sqlite_classes = [ "ResumeCounter" ]

[[migrations]]
tag = "v5"
new_sqlite_classes = [ "UniqueVisitors" ]